<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Stylized checkmark in a circle -->
  <g id="icon">
    <!-- Outer circle -->
    <circle cx="50" cy="60" r="35" fill="none" stroke="url(#blueGradient)" stroke-width="3"/>
    
    <!-- Inner checkmark -->
    <path d="M 35 60 L 45 70 L 65 45" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Accent dots -->
    <circle cx="50" cy="25" r="2.5" fill="#2563eb"/>
    <circle cx="85" cy="60" r="2.5" fill="#2563eb"/>
  </g>
  
  <!-- Company Name -->
  <g id="text">
    <!-- COA -->
    <text x="105" y="65" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#1e293b" letter-spacing="-1">
      COA
    </text>
    
    <!-- Auditing -->
    <text x="105" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" letter-spacing="2">
      AUDITING
    </text>
  </g>
</svg>
